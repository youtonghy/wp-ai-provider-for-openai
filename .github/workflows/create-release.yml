name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version/tag, for example v1.0.4'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      ZIP_NAME: OpenAI-compatible.zip

    steps:
      - name: Checkout default branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Build release archive
        run: |
          set -euo pipefail

          git ls-files -z . ":(exclude)${ZIP_NAME}" | xargs -0 zip -q "${ZIP_NAME}"

      - name: Generate release notes
        run: |
          set -euo pipefail

          LAST_RELEASE_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            --jq '[.[] | select(.draft == false)][0].tag_name // ""')"

          if [ -n "${LAST_RELEASE_TAG}" ] && git rev-parse --verify --quiet "${LAST_RELEASE_TAG}^{commit}" >/dev/null; then
            git log --format='- %s' "${LAST_RELEASE_TAG}..HEAD" > release-notes.md
          else
            git log --format='- %s' HEAD > release-notes.md
          fi

          if [ ! -s release-notes.md ]; then
            echo "- No commits since the previous release." > release-notes.md
          fi

      - name: Create release
        run: |
          set -euo pipefail

          TARGET_SHA="$(git rev-parse HEAD)"

          gh release create "${VERSION}" "${ZIP_NAME}" \
            --target "${TARGET_SHA}" \
            --title "${VERSION}" \
            --notes-file release-notes.md
